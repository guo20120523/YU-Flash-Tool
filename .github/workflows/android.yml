name: Android safety-preview build
on:
  workflow_dispatch:
  push:
    branches: [main, master]
  pull_request:
permissions:
  contents: read
jobs:
  verify-and-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Run core safety simulations (no Android SDK required)
        run: gradle -PcoreOnly=true :core:test --no-daemon --console=plain
      - name: Check runner Android SDK (no automatic license acceptance)
        shell: bash
        run: |
          set -euo pipefail
          test -n "${ANDROID_HOME:-}"
          test -f "$ANDROID_HOME/platforms/android-35/android.jar"
          test -d "$ANDROID_HOME/build-tools/35.0.0"
          printf 'sdk.dir=%s\n' "$ANDROID_HOME" > local.properties
      - name: Lint Android and assemble debug APKs
        run: gradle :app:lintDebug :app:assembleDebug :app:assembleDebugAndroidTest --no-daemon --console=plain
      - name: Upload test and lint evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: YU-Flash-Tool-verification
          path: |
            core/build/reports/tests/
            core/build/test-results/
            app/build/reports/lint-results-debug.*
          if-no-files-found: warn
      - name: Record build provenance and corresponding source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p deliverables
          cp app/build/outputs/apk/debug/app-debug.apk deliverables/YU-Flash-Tool-debug.apk
          git archive --format=zip --output=deliverables/YU-Flash-Tool-source.zip HEAD
          printf 'Repository: %s\nCommit: %s\nRun: %s/%s/actions/runs/%s\nType: debug safety preview; hardware writing disabled\n' "$GITHUB_REPOSITORY" "$GITHUB_SHA" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" > deliverables/BUILD-INFO.txt
          cp LICENSE THIRD_PARTY_NOTICES.md deliverables/
          (cd deliverables && sha256sum YU-Flash-Tool-debug.apk YU-Flash-Tool-source.zip > SHA256SUMS.txt)
      - name: Upload APK and matching source (only after successful checks)
        uses: actions/upload-artifact@v4
        with:
          name: YU-Flash-Tool-debug-apk
          path: deliverables/
          if-no-files-found: error
