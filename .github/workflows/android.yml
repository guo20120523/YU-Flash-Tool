name: Android safety-preview build
on:
  workflow_dispatch:
  push:
    branches: [main, master]
  pull_request:
permissions:
  contents: read
jobs:
  verify-and-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Run core safety simulations (no Android SDK required)
        run: gradle -PcoreOnly=true :core:test --no-daemon --console=plain
      - name: Check runner Android SDK (no automatic license acceptance)
        shell: bash
        run: |
          set -euo pipefail
          test -n "${ANDROID_HOME:-}"
          test -f "$ANDROID_HOME/platforms/android-35/android.jar"
          test -d "$ANDROID_HOME/build-tools/35.0.0"
          printf 'sdk.dir=%s\n' "$ANDROID_HOME" > local.properties
      - name: Lint Android and assemble debug APKs
        run: gradle :app:lintDebug :app:assembleDebug :app:assembleDebugAndroidTest --no-daemon --console=plain
      - name: Upload test and lint evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: YU-Flash-Tool-verification
          path: |
            core/build/reports/tests/
            core/build/test-results/
            app/build/reports/lint-results-debug.*
          if-no-files-found: warn
      - name: Upload APK (only after successful checks)
        uses: actions/upload-artifact@v4
        with:
          name: YU-Flash-Tool-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
